apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
      - image: docker.io/mabusaa/ks-guestbook-demo:0.2
        name: guestbook-ui
        ports:
        - containerPort: 80 # <-- This is around line 17. Ensure it's exactly aligned.
